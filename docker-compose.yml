version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: klartext_postgres
    environment:
      POSTGRES_USER: klartext
      POSTGRES_PASSWORD: klartext_secret
      POSTGRES_DB: klartext_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
